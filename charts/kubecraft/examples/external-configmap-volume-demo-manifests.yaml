# Source: kubecraft/templates/cronjob.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app/name: external-config-consumer-snapshot
    app/realm: sandbox
    app/subset: main
  name: external-config-consumer-snapshot
  namespace: default
spec:
  schedule: "*/15 * * * *"
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app/name: external-config-consumer-snapshot
            app/realm: sandbox
            app/subset: main
        spec:
          containers:
          - command:
            - /bin/sh
            - -c
            - cat /app/config/application.yaml
            env:
            - name: REALM_CONTEXT_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app/realm']
            image: docker.io/busybox:latest
            name: app
            volumeMounts:
            - mountPath: /app/config
              name: external-config
              readOnly: true
          restartPolicy: OnFailure
          volumes:
          - configMap:
              defaultMode: 420
              items:
              - key: application.yaml
                path: application.yaml
              - key: logback.xml
                path: logging/logback.xml
              name: platform-runtime-config
            name: external-config
